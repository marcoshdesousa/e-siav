# Blueprint do Render para o App do DBV.
# No Render: New → Blueprint → escolha este repositório → Apply.
#
# Plano Starter com disco permanente em /var/data: o banco (contas, clubes,
# membros, requisitos, chat) e as fotos enviadas ficam salvos entre deploys
# e reinícios. Nada é apagado na inicialização.
#
# ADMIN_PASSWORD: senha do login "admin". Fica só no painel do Render
# (Environment), nunca no código. Só é usada para criar o administrador
# quando o banco está vazio.
services:
  - type: web
    name: appdodbv
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run render-start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: dbv-data
      mountPath: /var/data
      sizeGB: 1
