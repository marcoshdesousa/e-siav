  <style>
    /* Página que aparece quando o sistema está fora do ar (atualização ou erro). Não depende do servidor. */
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: Poppins, Nunito, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #143A22 0%, #1F5A2E 55%, #3E8A3A 100%);
      color: #fff; display: flex; align-items: center; justify-content: center; text-align: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    }
    main { max-width: 380px; width: 100%; }
    img { width: 132px; height: 132px; border-radius: 30px; box-shadow: 0 14px 40px rgba(0, 0, 0, .35); }
    h1 { font-size: 1.7rem; line-height: 1.2; margin: 1.6rem 0 .5rem; font-weight: 800; }
    p { margin: 0; font-size: 1.05rem; opacity: .9; line-height: 1.45; }
    .bar { height: 6px; width: 100%; max-width: 220px; margin: 1.8rem auto 0; background: rgba(255, 255, 255, .18); border-radius: 99px; overflow: hidden; }
    .bar span { display: block; height: 100%; width: 40%; background: #F2DE2A; border-radius: 99px; animation: vai 1.6s ease-in-out infinite; }
    @keyframes vai { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    small { display: block; margin-top: 2.2rem; opacity: .6; font-size: .8rem; }
  </style>
